data:
  start_date: "2002-01-01"
  end_date: "2024-12-31"
  ine_base_url: "https://servicios.ine.es/wstempus/js/ES"

  urls:
    ipc_general: "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC251852?date=20020101:20241231&tip=A"
    ipc_groups: "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC252118?date=20020101:20241231&tip=A" # 03.1 Prendas de vestir (Índice)
    ipca: "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPCA1847?date=20020101:20241231&tip=A" # IPCA general (Índice)

  # Política de reintentos para las llamadas HTTP
  retry:
    max_attempts: 3
    backoff_factor: 2
    timeout: 15

models:
  arima:
    max_p: 5
    max_d: 2
    max_q: 5
  random_forest:
    n_estimators: 100
    max_depth: 10
  lstm:
    epochs: 50
    batch_size: 32
    hidden_units: 32

evaluation:
  test_size: 0.2
  validation_size: 0.2

feature_engineering:
  lag_periods: [1, 3, 6, 12]
  rolling_windows: [3, 6, 12]
  seasonal_features: true
  economic_indicators: true

paths:
  data:
    raw: "data/raw/"
    processed: "data/processed/"
  models: "models/"
  reports: "reports/"
  logs: "logs/"

output:
  csv_encoding: "utf-8"
  decimal_places: 4
  date_format: "%Y-%m-%d"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "inflation_prediction.log"

prediction:
  horizon_months: 12
